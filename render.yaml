services:
  - type: web
    name: dnpec-site
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      # Optionnelle : URL du WordPress headless (wp-json/wp/v2). Tant qu'elle
      # n'est pas définie, le site fonctionne avec les données de démonstration
      # de lib/mock-data.ts (voir README § Connecter le WordPress headless).
      - key: WORDPRESS_API_URL
        sync: false
      # Optionnelle : clé API Resend pour l'envoi des formulaires de contact
      # (app/api/contact/route.ts). Tant qu'elle n'est pas définie, le
      # formulaire affiche une erreur claire à l'utilisateur plutôt que
      # d'échouer silencieusement.
      - key: RESEND_API_KEY
        sync: false
      # Optionnelles : identifiants d'un Application Password WordPress
      # (utilisateur avec droits upload_files/edit_posts), pour la soumission
      # d'articles RPAE (app/api/rpae-submission/route.ts). Tant qu'elles ne
      # sont pas définies, le formulaire affiche une erreur claire plutôt que
      # d'échouer silencieusement.
      - key: WORDPRESS_APP_USER
        sync: false
      - key: WORDPRESS_APP_PASSWORD
        sync: false
      # Optionnelle : e-mail du comité RPAE notifié à chaque nouvelle
      # soumission (sinon repli sur l'adresse de test Resend du projet).
      - key: RPAE_COMITE_EMAIL
        sync: false
      # Optionnelle : adresse d'expédition Resend (formulaires contact /
      # newsletter / notification RPAE).
      - key: CONTACT_FROM_EMAIL
        sync: false
